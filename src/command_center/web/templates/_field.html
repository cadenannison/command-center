{% macro single_input(card, f, oob=False) %}<input id="f-{{ card.source }}-{{ f.key }}" name="{{ f.key }}" type="{{ 'password' if f.secret else 'text' }}" spellcheck="false" autocapitalize="off" autocomplete="off"{% if f.value %} value="{{ f.value }}"{% endif %}{% if f.secret and card.keep_typed %} hx-preserve="true"{% endif %}{% if f.is_set and f.secret %} placeholder="Leave blank to keep"{% elif f.hint %} placeholder="{{ f.hint }}"{% endif %}{% if oob %} hx-swap-oob="true"{% endif %}>{% endmacro %}
