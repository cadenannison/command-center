name: CI
on:
  push: { branches: [main] }
  pull_request:
  merge_group:                      # required if you use a merge queue, or required checks never report
  schedule:
    - cron: "17 6 * * 1"            # weekly: new advisories surface in the audit job without blocking PRs
permissions: {}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_FROZEN: "1"                    # never re-resolve in CI: uv.lock is the source of truth

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: uv sync --all-extras
      - run: mise run fmt:check
      - run: mise run lint
      - run: mise run typecheck
      - run: mise run arch
      - run: mise run gen:check
      - run: mise run test
      - run: bash scripts/test-floor.sh

  # The UI gates (decisions 0300, 0301, 0303). The job always runs so "gate" can require it; the steps
  # run only once ui/package.json exists. Install is frozen and script-free; every action is SHA-pinned.
  ui:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - id: present
        run: |
          if [ -f ui/package.json ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "ui/ not scaffolded yet; nothing to check"; fi
      - if: steps.present.outputs.found == 'true'
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - if: steps.present.outputs.found == 'true'
        run: bash scripts/ui.sh guard
      - if: steps.present.outputs.found == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: ui
      - if: steps.present.outputs.found == 'true'
        run: pnpm run typecheck
        working-directory: ui
      - if: steps.present.outputs.found == 'true'
        run: pnpm run lint
        working-directory: ui
      - if: steps.present.outputs.found == 'true'
        run: pnpm run test
        working-directory: ui
      - if: steps.present.outputs.found == 'true'
        run: bash scripts/ui.sh floor
      - if: steps.present.outputs.found == 'true'
        run: pnpm run build
        working-directory: ui

  secrets:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }   # full history for the scan
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: mise run secrets

  # Advisories are a separate job and not part of the gate: a newly published CVE must not block
  # an unrelated PR. The weekly schedule makes it fail visibly instead.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: uv sync --all-extras
      # pip-audit, then `pnpm audit` for the UI when ui/ exists (scripts/ui.sh audit, decision 0301)
      - run: mise run audit

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with: { fail-on-severity: high }

  # Not required and not in "gate": runs the env-guarded cases (decisions 0047, 0075, 0083) against a
  # real Redis and a real Postgres. A red run here does not block a merge. The Postgres password is
  # a throwaway for a container that lives as long as this job; it must start with "fake-" (AGENTS.md).
  integration:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cc
          POSTGRES_PASSWORD: fake-ci-postgres-password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cc"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CC_TEST_REDIS_URL: redis://localhost:6379/0
      CC_TEST_POSTGRES_URL: postgresql+psycopg://cc:fake-ci-postgres-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: uv sync --all-extras
      # Exactly the files whose cases are skipped without CC_TEST_REDIS_URL or CC_TEST_POSTGRES_URL.
      - run: >-
          uv run pytest --no-cov
          tests/test_job_queue_contract.py tests/test_job_queue_dead_letter.py
          tests/test_report_stream_contract.py tests/test_chaos_disconnect.py
          tests/test_chaos_disconnect_sink.py tests/test_chaos_distributed.py
          tests/test_normalizer_atomic.py tests/test_report_sink.py
          tests/test_state_generation_column.py

  # The single required status check: mark only "gate" as required in branch protection.
  gate:
    if: always() && github.event_name != 'schedule'
    needs: [check, ui, secrets, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "needs results: $RESULTS"
          if echo "$RESULTS" | grep -Eq 'failure|cancelled'; then exit 1; fi
          # dependency-review only runs on pull requests; a skip is fine elsewhere, not on a PR
          if [ "$EVENT" = "pull_request" ] && echo "$RESULTS" | grep -q 'skipped'; then exit 1; fi
