<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Command Center — Grid Dashboard</title>
<style>
@font-face{font-family:"Sora";src:url("assets/sora.woff2") format("woff2") format("woff2");font-weight:100 800;font-display:swap}
/* ---------- tokens (JSON copy lives in #cc-tokens) ---------- */
:root{--fs:1;--glow:1;--ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;--display:"Sora",var(--ui);
--r-widget:18px;--r-ctl:10px;--row:3.1rem;--gap:14px;--unit:40px;--ease:cubic-bezier(.2,.8,.2,1);--t1:140ms;--t2:240ms;--t3:420ms}
[data-theme=dark]{color-scheme:dark;--bgc:#07090D;--text:#F2F6FB;--text2:#B4C0D0;--text3:#8E9DB2;--ice:#8FD3FF;--icergb:143 211 255;--glass:rgb(12 17 25/.46);--bar:rgb(10 14 20/.55);--pop:#101620;--edge:rgb(255 255 255/.28);--line:rgb(255 255 255/.10);--line2:rgb(255 255 255/.18);--chip:rgb(255 255 255/.09);--over:#FF9AA6;
--canvas:255 122 138;--ls:79 224 200;--gmail:255 194 92;--cal:167 139 250;--wx:124 199 255;--manual:197 208 222;
--canvas-ink:#FF9AA6;--ls-ink:#6FEAD6;--gmail-ink:#FFCB75;--cal-ink:#BBA6FC;--wx-ink:#9AD6FF;--manual-ink:#C5D0DE;
--orbs:radial-gradient(46vw 40vh at 8% 6%,rgb(60 130 255/.40),transparent 70%),radial-gradient(40vw 40vh at 94% 34%,rgb(40 200 190/.26),transparent 70%),radial-gradient(52vw 46vh at 50% 108%,rgb(120 90 255/.34),transparent 70%),linear-gradient(160deg,#0B1018,#07090D)}
[data-theme=light]{color-scheme:light;--bgc:#EEF3F9;--text:#0E1622;--text2:#3F4E62;--text3:#566579;--ice:#0A64B0;--icergb:40 140 230;--glass:rgb(255 255 255/.68);--bar:rgb(255 255 255/.6);--pop:#fff;--edge:rgb(255 255 255/.95);--line:rgb(20 40 70/.12);--line2:rgb(20 40 70/.2);--chip:rgb(20 40 70/.07);--over:#B4233C;
--canvas:226 61 88;--ls:13 160 138;--gmail:224 150 20;--cal:124 92 240;--wx:40 140 230;--manual:110 126 148;
--canvas-ink:#B4233C;--ls-ink:#08705F;--gmail-ink:#8A5500;--cal-ink:#5B36C9;--wx-ink:#0A64B0;--manual-ink:#465569;
--orbs:radial-gradient(46vw 40vh at 8% 6%,rgb(120 190 255/.60),transparent 70%),radial-gradient(40vw 40vh at 94% 34%,rgb(140 228 216/.50),transparent 70%),radial-gradient(52vw 46vh at 50% 108%,rgb(182 166 255/.50),transparent 70%),linear-gradient(160deg,#F8FAFD,#E9EFF7)}
[data-theme=dark][data-hc]{--glass:#0D1118;--bar:#0A0E14;--line:rgb(255 255 255/.3);--text3:#B4C0D0}
[data-theme=light][data-hc]{--glass:#fff;--bar:#fff;--line:rgb(20 40 70/.4);--text3:#3F4E62}
[data-compact]{--row:2.5rem}
/* ---------- base ---------- */
*{box-sizing:border-box}
html{font-size:calc(16px*var(--fs))}
body{margin:0;height:100vh;display:flex;flex-direction:column;font:400 .875rem/1.4 var(--ui);color:var(--text);background:var(--bgc);overflow:hidden}
body::before{content:"";position:fixed;inset:0;background:var(--orbs);z-index:-1}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.h{font-family:var(--display);font-weight:600;letter-spacing:-.02em;margin:0}
.btn{height:32px;padding:0 10px;border-radius:var(--r-ctl);border:0;background:none;color:var(--text2);font:500 .8125rem var(--ui);display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;transition:background var(--t1)}
.btn:hover{background:var(--chip);color:var(--text)}
.btn.on{color:var(--text);background:var(--chip);box-shadow:inset 0 1px 0 var(--edge),inset 0 -2px 0 var(--ice)}
.btn.sm{height:28px;padding:0 8px;font-size:.75rem;background:var(--chip)}
.btn:disabled{opacity:.45;cursor:default}
.gloss,.gloss:hover{color:#06121C;background:linear-gradient(180deg,#B5E1FF,#8FD3FF);box-shadow:inset 0 1px 0 rgb(255 255 255/.55);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
/* ---------- titlebar + rail ---------- */
.tb{min-height:52px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--bar);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);border-bottom:1px solid var(--line);position:relative;z-index:5}
.lights{display:flex;gap:8px;margin-right:4px}.lights i{width:12px;height:12px;border-radius:50%;background:var(--line2)}
.logo{height:28px;border-radius:7px;display:block}
.wm{font-size:.95rem;margin-right:8px;white-space:nowrap}
.tb>*{flex:none}
.nn{flex:0 1 auto;min-width:0;overflow:hidden;display:flex;gap:16px;font-size:.78rem;color:var(--text2);margin:0 auto;white-space:nowrap;font-variant-numeric:tabular-nums}
.nn b{font:600 .68rem var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--ice);margin-right:6px}
.capw{position:relative}
.cap{height:32px;width:250px;border-radius:10px;border:1px solid var(--line);background:var(--chip);padding:0 44px 0 10px;font-size:.8125rem}
.cap::placeholder{color:var(--text3)}
.capw kbd{position:absolute;right:8px;top:7px;font:500 .7rem var(--ui);color:var(--text3);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.shell{flex:1;display:flex;min-height:0;position:relative}
.rail{width:76px;flex:none;padding:10px 8px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);background:var(--bar);backdrop-filter:blur(24px)}
[data-norail] .rail{display:none}
.rb{height:54px;border:0;background:none;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:.69rem;font-weight:500;color:var(--text2);cursor:pointer}
.rb:hover{background:var(--chip);color:var(--text)}
.rb.on{color:var(--text);background:var(--chip);box-shadow:inset 0 1px 0 var(--edge),inset 2px 0 0 var(--ice)}
.main{flex:1;min-width:0;overflow:auto;padding:18px 22px 90px}
@media(max-width:1380px){.nn{display:none}}
@media(max-width:1180px){.cap{width:170px}}
@media(max-width:820px){.wm,.lights{display:none}.tb{flex-wrap:wrap;padding:8px 14px}}
/* ---------- popovers, toast ---------- */
.pop{position:absolute;top:58px;right:14px;width:290px;padding:14px;border-radius:14px;background:var(--pop);backdrop-filter:blur(24px);box-shadow:inset 0 0 0 1px var(--line2),0 18px 50px rgb(0 0 0/.35);z-index:20;display:none;flex-direction:column;gap:12px}
.pop.show{display:flex}
.pop label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.8125rem;min-height:32px}
.pop input[type=range]{width:130px;accent-color:var(--ice)}
.pop input[type=checkbox]{width:18px;height:18px;accent-color:var(--ice)}
.pop .li{display:flex;align-items:center;gap:8px;font-size:.8125rem}
.pop .li span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap2{font-size:.75rem;color:var(--text3)}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:opacity var(--t2) var(--ease),transform var(--t2) var(--ease);display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-radius:14px;background:var(--pop);backdrop-filter:blur(24px);box-shadow:inset 0 0 0 1px var(--line2),0 14px 40px rgb(0 0 0/.35);z-index:30;font-size:.8125rem;max-width:92vw}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .msg{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ---------- grid + widget ---------- */
.eb{display:none;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;padding:8px 8px 8px 14px;border-radius:14px;background:var(--glass);box-shadow:inset 0 0 0 1px rgb(var(--icergb)/.45);font-size:.8125rem}
[data-edit] .eb{display:flex}
.grid{display:grid;grid-template-columns:repeat(var(--cols,12),minmax(0,1fr));grid-auto-rows:var(--unit);gap:var(--gap);grid-auto-flow:dense;padding:6px}
.wd{position:relative;min-width:0;border-radius:var(--r-widget);background:linear-gradient(rgb(var(--src)/.10),rgb(var(--src)/.04)),var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:inset 0 1px 0 var(--edge),inset 0 0 0 1px rgb(var(--src)/.42),0 0 22px rgb(var(--src)/calc(.36*var(--glow))),0 0 64px rgb(var(--src)/calc(.18*var(--glow)));display:flex;flex-direction:column;overflow:hidden;--src:var(--icergb)}
.wd.mix{box-shadow:inset 0 1px 0 var(--edge),inset 0 0 0 1px rgb(var(--icergb)/.40),-18px -12px 48px -14px rgb(var(--canvas)/calc(.46*var(--glow))),18px -12px 48px -14px rgb(var(--ls)/calc(.42*var(--glow))),18px 14px 48px -14px rgb(var(--gmail)/calc(.38*var(--glow))),-18px 14px 48px -14px rgb(var(--manual)/calc(.34*var(--glow))),0 0 24px rgb(var(--icergb)/calc(.2*var(--glow)))}
[data-hc] .wd,[data-hc] .tb,[data-hc] .rail{backdrop-filter:none;-webkit-backdrop-filter:none}
.wh{display:flex;align-items:center;gap:8px;padding:12px 12px 10px 16px;flex:none;min-height:44px}
.wh .h{font-size:.95rem;white-space:nowrap}
.wh .dot{background:rgb(var(--src))}
.sub{color:var(--text3);font-size:.75rem;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:none;margin-left:auto;font:600 .7rem var(--display);font-variant-numeric:tabular-nums;padding:3px 8px;border-radius:8px;background:rgb(var(--icergb)/.18);color:var(--ice);white-space:nowrap}
[data-edit] .grid .badge,.mx .badge{display:inline-block}
[data-edit] .grid .sub,.mx .sub{display:none}
.wb{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.wf{display:flex;justify-content:space-between;gap:8px;padding:8px 16px 10px;border-top:1px solid var(--line);font-size:.75rem;color:var(--text3);flex:none;white-space:nowrap}
.grp{font-size:.69rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:10px 16px 4px;border-top:1px solid var(--line)}
.over{color:var(--over)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:4px 8px;min-height:var(--row);border-top:1px solid var(--line);flex:none;transition:opacity var(--t3) var(--ease)}
.grp+.row{border-top:0}
.ck,.ib{width:32px;height:32px;flex:none;display:flex;align-items:center;justify-content:center;border:0;background:none;border-radius:8px;color:var(--text3);padding:0;cursor:pointer;text-decoration:none}
.ib:hover,.ck:hover{background:var(--chip);color:var(--text)}
.ck span{width:16px;height:16px;border-radius:5px;box-shadow:inset 0 0 0 1.25px var(--text3);display:flex;align-items:center;justify-content:center;transition:background var(--t2) var(--ease)}
.ck span svg{width:11px;height:11px;stroke:#06121C;stroke-width:2;opacity:0}
.row.going{opacity:.5}
.row.going .ck span{background:var(--ice);box-shadow:0 0 0 0 rgb(var(--icergb)/.5);animation:pop var(--t3) var(--ease)}
.row.going .ck svg{opacity:1}
.row.going .t{text-decoration:line-through;color:var(--text3)}
@keyframes pop{0%{transform:scale(.8)}45%{transform:scale(1.06);box-shadow:0 0 0 5px rgb(var(--icergb)/0)}100%{transform:scale(1)}}
.row.open .xb svg{transform:rotate(180deg)}
.mn{flex:1 1 0;min-width:0}
.t{display:block;width:100%;border:0;background:none;padding:0;text-align:left;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
div.t{cursor:default}
.m{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--text2);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.note{font-size:.75rem;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:6px}
.chip{height:24px;padding:0 9px;border-radius:8px;border:0;background:var(--chip);font-size:.75rem;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--text);flex:none}
button.chip{cursor:pointer}
.chip.add{background:none;color:var(--text3)}
.chip.ai{background:none;border:1px dashed var(--text3)}
.chip.nowc{background:rgb(var(--icergb)/.2);color:var(--ice)}
.pill{min-width:30px;height:22px;padding:0 8px;border-radius:11px;background:var(--p);color:#0A0D12;font:700 .75rem var(--display);display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;flex:none}
.exp{flex-basis:100%;padding:4px 8px 10px 40px;display:flex;flex-direction:column;gap:10px;font-size:.8125rem;color:var(--text2)}
.exp p{margin:0}
.why,.xa{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.why>b{flex-basis:100%;color:var(--text);font-weight:600}
.xa input{width:64px;height:28px;border-radius:8px;border:1px solid var(--line2);background:var(--chip);padding:0 8px}
.dr{display:flex;flex-direction:column;gap:6px;font-size:.75rem;color:var(--text3)}
.dr textarea{border-radius:10px;border:1px solid var(--line2);background:var(--chip);padding:8px 10px;font-size:.8125rem;resize:vertical;color:var(--text)}
.empty,.free,.warn,.stale{padding:10px 16px;font-size:.8125rem;color:var(--text2)}
.warn b{color:var(--over)}
.stale{display:flex;align-items:center;gap:8px;justify-content:space-between;border-top:1px solid var(--line);color:var(--gmail-ink)}
/* tiers: one rule set, width and height independent */
.wd[data-wt="1"] .meta,.wd[data-wt="1"] .est,.wd[data-wt="1"] .xb{display:none}
.wd:not([data-wt="3"]) .note,.wd:not([data-wt="3"]) .acts{display:none}
/* events */
.tm{width:4.9rem;text-align:right;font:500 .8125rem var(--display);font-variant-numeric:tabular-nums;padding-right:6px;flex:none}
.ev{padding-left:10px}
.ev.past .tm,.ev.past .t{color:var(--text3)}
.ev.now .tm{color:var(--ice)}
.strip{position:relative;height:30px;margin:4px 16px 0;border-radius:8px;background:var(--chip);flex:none}
.strip i{position:absolute;top:4px;bottom:4px;border-radius:5px;background:rgb(var(--cal)/.6)}
.strip b{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:1px;background:var(--ice)}
.ticks{display:flex;justify-content:space-between;margin:4px 16px 8px;font-size:.69rem;color:var(--text3);font-variant-numeric:tabular-nums;flex:none}
/* workload + week + weather */
.load{padding:10px 16px 12px;border-top:1px solid var(--line);font-size:.75rem;color:var(--text2);display:flex;flex-direction:column;gap:6px;flex:none}
.bar{height:8px;border-radius:4px;background:var(--chip);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--ice)}
.bar.ovr i{background:var(--over)}
.wk{flex:1;min-height:96px;display:flex;gap:8px;padding:6px 16px 4px}
.wk .d{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;color:var(--text3)}
.wk .trk{flex:1;width:100%;max-width:44px;position:relative}
.wk .trk i{position:absolute;left:0;right:0;bottom:0;border:1.5px dashed var(--text3);border-radius:6px}
.wk .trk b{position:absolute;left:4px;right:4px;bottom:0;border-radius:4px;background:var(--ice)}
.wk .ovr .trk b{background:var(--over)}
.wk .today>span{color:var(--text);font-weight:600}
.wk small{font-size:.66rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.wxb{padding:2px 16px 10px;display:flex;flex-direction:column;gap:8px}
.wxb .big{font:500 2.4rem/1 var(--display);font-variant-numeric:tabular-nums}
.wxr{display:flex;gap:6px;flex-wrap:wrap}
/* edit mode */
.rz,.ps{display:none}
[data-edit] .grid .wd{outline:1px dashed rgb(var(--icergb)/.5);outline-offset:3px}
[data-edit] .grid .rz{display:block;position:absolute;z-index:3;touch-action:none}
.rz.e{top:44px;bottom:22px;right:0;width:14px;cursor:ew-resize}
.rz.s{left:22px;right:22px;bottom:0;height:14px;cursor:ns-resize}
.rz.se{right:0;bottom:0;width:24px;height:24px;cursor:nwse-resize}
.rz::after{content:"";position:absolute;background:var(--ice);border-radius:3px;box-shadow:0 0 10px rgb(var(--icergb)/.7)}
.rz.e::after{right:4px;top:calc(50% - 18px);width:4px;height:36px}
.rz.s::after{bottom:4px;left:calc(50% - 18px);height:4px;width:36px}
.rz.se::after{right:5px;bottom:5px;width:10px;height:10px;border-radius:3px 3px 8px 3px}
[data-edit] .grid .ps{display:flex;gap:4px}
.ps button{width:32px;height:28px;border-radius:8px;border:0;background:var(--chip);font:600 .72rem var(--display);cursor:pointer;color:var(--text2)}
.ps button:hover{color:var(--text);background:var(--line2)}
/* summary */
.sum{margin:0 6px 14px;--src:var(--icergb)}
.sum p{margin:0;padding:0 16px 14px 16px;color:var(--text2);max-width:70ch}
.sum.shut p{display:none}
[data-focus] .sum,[data-focus] .grid .wd:not([data-id=needs]):not([data-id=events]){display:none}
/* privacy */
[data-priv] .pv{color:transparent!important;background:var(--line2);border-radius:6px;user-select:none}
[data-priv] .pv *{visibility:hidden}
/* quick capture panel */
.cx{display:none;position:absolute;top:40px;right:0;width:340px;padding:12px;border-radius:14px;background:var(--pop);backdrop-filter:blur(24px);box-shadow:inset 0 0 0 1px var(--line2),0 18px 50px rgb(0 0 0/.35);z-index:20;flex-wrap:wrap;gap:10px;align-items:center;font-size:.8125rem}
.capw:focus-within .cx{display:flex}
.cx label{display:flex;align-items:center;gap:6px;color:var(--text2)}
.cx input{height:32px;border-radius:8px;border:1px solid var(--line2);background:var(--chip);padding:0 8px}
/* calendar */
.calw{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.calw>.card{flex:1 1 560px;min-width:0;padding:16px 18px}
.calw>.wd{flex:0 0 350px;max-width:100%}
.calh{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.calh h2{margin:0 auto 0 10px;font-size:1.05rem;font-weight:500}
.calh .btn.sm{background:none}.calh .btn.sm.on{background:var(--chip);box-shadow:none;color:var(--text)}
.tgh,.tgl,.tgb{display:grid;grid-template-columns:48px repeat(var(--n),minmax(0,1fr))}
.dh{height:32px;border:0;background:none;font-size:.69rem;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);cursor:pointer;text-align:left;padding:0 8px;font-variant-numeric:tabular-nums}
.dh b{font:500 .875rem var(--display);color:var(--text);margin-left:4px;letter-spacing:0}
.dh.today,.dh.today b{color:var(--ice)}
.dh.today{box-shadow:inset 0 -2px 0 var(--ice)}
.tgl{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ln{display:flex;flex-direction:column;min-width:0;padding:4px 2px;border-left:1px solid var(--line);min-height:32px}
.hrs span{display:block;height:44px;font-size:.66rem;color:var(--text3);text-align:right;padding-right:6px;transform:translateY(-.5em);font-variant-numeric:tabular-nums}
.tgb{padding-top:8px}
.dc{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(var(--line) 0 1px,transparent 1px 44px)}
.eb2{position:absolute;left:1px;right:4px;border:0;border-radius:4px;background:rgb(var(--cal)/.16);box-shadow:inset 2px 0 0 rgb(var(--cal));text-align:left;padding:2px 6px 2px 9px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;font-size:.72rem;color:var(--text);line-height:1.3}
.eb2:hover{background:rgb(var(--cal)/.26)}
.eb2 b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eb2 small{color:var(--text2);font-size:.66rem;font-variant-numeric:tabular-nums}
.eb2.on{box-shadow:inset 2px 0 0 rgb(var(--cal)),inset 0 0 0 1px var(--ice)}
.nowl{position:absolute;left:0;right:0;height:1px;background:var(--ice);pointer-events:none}
.nowl::before{content:"";position:absolute;left:-3px;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--ice)}
.ci{display:flex;gap:6px;align-items:center;width:100%;height:24px;border:0;border-radius:4px;background:none;padding:0 6px;font-size:.72rem;color:var(--text);cursor:pointer;text-align:left}
.ci::before{content:"";width:6px;height:6px;border-radius:50%;background:rgb(var(--c));flex:none}
.ci:hover{background:var(--chip)}
.ci.on{background:var(--chip);box-shadow:inset 0 0 0 1px var(--ice)}
.ci span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci small{color:var(--text3);font-size:.66rem;font-variant-numeric:tabular-nums;white-space:nowrap}

<li><b>Order.</b> Overdue is pinned first, then soonest. Ties go to the higher priority. "Soon" means the next 48 hours.</li>
<li><b>Combining.</b> A widget can merge sources of the same kind only: events with events, tasks with tasks. Owed replies count as tasks when their toggle is on. Needs me is the one widget that crosses kinds.</li>
<li><b>Glow.</b> A single-source widget glows in its source color. A combined widget blends the colors of its sources. Each source's color is yours to assign, and glow strength is a setting.</li>
<li><b>Adding and notes.</b> Quick capture takes a title, date and time together, from the fields or typed into the title. Every task and event has a Notes field in its expanded view.</li>
<li><b>Calendar.</b> The Calendar tab combines every source in day, week and month views. Events sit on the time grid; tasks and owed replies sit in the Due lane of their day.</li>
<li><b>Placement (for the app; this mock packs by order).</b> Widgets auto-arrange with even spacing by default. Dragging one lifts it with a short ease, shows a snapped drop outline, and lets neighbours slide aside instead of jumping. A dropped widget can be pinned to its cell; pinned widgets hold their place while unpinned ones keep flowing around them.</li>

function draw(){
 for(const v of['dash','rules','cal','chat','hist','set'])$('#'+v).hidden=S.view!==v;
 if(S.view==='chat')drawChat();if(S.view==='hist')drawHist();if(S.view==='set')drawSet();
 if(S.view==='dash'){drawSum();drawGrid()}else if(S.view==='cal')drawCal();else if(S.view==='rules')drawRules();
 $('#tabs').innerHTML=Object.entries(TABS).map(([k,n])=>`<button class="btn${S.view==='dash'&&S.tab===k?' on':''}" data-act="tab" data-v="${k}">${n}</button>`).join('')+`<button class="btn${S.view==='cal'?' on':''}" data-act="view" data-v="cal">Calendar</button><button class="ib" data-act="pop" data-v="newp" aria-label="New dashboard">${ic('plus')}</button>`;
 drawGal();drawLay();
 $$('.rb[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
 $('.rb[data-act=focus]').classList.toggle('on','focus' in root.dataset);$('.rb[data-act=priv]').classList.toggle('on','priv' in root.dataset);
 const ed='edit' in root.dataset;$('#editl').textContent=ed?'Done':'Edit';$('#editb').classList.toggle('gloss',ed);
 $('#ub').disabled=!S.hist.length;$('#rb').disabled=!S.fut.length;
 const dn=[...DONE,...T.filter(t=>t.done)];$('#dn').textContent=dn.length;
 $('#donep').innerHTML=`<b class="h">Done today</b>`+dn.map(d=>`<div class="li"><span class="pv">${esc(d.t)}</span><span class="cap2">${d.at}</span>${d.id?`<button class="btn sm" data-act="undone" data-id="${d.id}">Undo</button>`:''}</div>`).join('');
 $$('[data-act=theme]').forEach(b=>b.classList.toggle('on',b.dataset.v===root.dataset.theme));
}

/* ---------- shared undo toast ---------- */
let tt,tu;
function toast(msg,{undo,calib}={}){tu=undo;const el=$('#toast');
 el.innerHTML=`<span class="msg">${esc(msg)}</span>${calib?`<span class="cap2">It took:</span><button class="btn sm" data-act="calib">Shorter</button><button class="btn sm" data-act="calib">About right</button><button class="btn sm" data-act="calib">Longer</button>`:''}${undo?`<button class="btn sm" data-act="tundo">${ic('undo')}Undo</button>`:''}`;
 el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),calib?9000:6000)}
function tog(k,v){if(v===undefined)v=!(k in root.dataset);if(v)root.dataset[k]='';else delete root.dataset[k];$$(`[data-tog=${k}]`).forEach(c=>c.checked=v)}
function commit(before,msg){S.hist.push(before);S.fut=[];draw();if(msg)toast(msg,{undo:()=>step(S.hist,S.fut)})}
function step(from,to){if(!from.length)return;to.push(JSON.stringify(S.layouts));S.layouts=JSON.parse(from.pop());draw()}

/* ---------- actions ---------- */
document.addEventListener('click',e=>{
 const a=e.target.closest('[data-act]');
 if(!e.target.closest('.pop')&&!(a&&a.dataset.act==='pop'))$$('.pop.show').forEach(p=>p.classList.remove('show'));
 if(!a)return;const act=a.dataset.act,v=a.dataset.v,row=a.closest('.row'),t=row&&T.find(x=>x.id===row.dataset.id);
 if(act==='open'){const k=row.dataset.key;S.open.has(k)?S.open.delete(k):S.open.add(k);draw()}
 else if(act==='done'&&t){$$(`.row[data-id="${t.id}"]`).forEach(r=>r.classList.add('going'));
  setTimeout(()=>{t.done=true;t.at='1:20 PM';draw();toast('Done: '+t.t,{calib:!!t.est,undo(){t.done=false;draw()}})},RM?0:460)}
 else if(act==='snooze'&&t){t.snz=true;draw();toast('Snoozed until tomorrow, 8:00 AM',{undo(){t.snz=false;draw()}})}
 else if(act==='draft'&&t){t.draft=t.dr||'';S.open.add(row.dataset.key);draw()}
 else if(act==='undone'){const x=T.find(x=>x.id===a.dataset.id);x.done=x.dis=false;draw();if(S.view!=='hist')$('#donep').classList.add('show')}
 else if(act==='dismiss'&&t){t.dis=true;t.at='1:20 PM';draw();toast('Dismissed: '+t.t,{undo(){t.dis=false;draw()}})}
 else if(act==='ask'){say(v)}
 else if(act==='hf'){S.hf=v;draw()}
 else if(act==='setsec'){S.set=v;if(a.dataset.go)S.view='set';draw()}
 else if(act==='pair'){S.pair=!S.pair;draw()}
 else if(act==='unpair'){const d=S.dev.splice(+v,1)[0];draw();toast(d.n+' unpaired',{undo(){S.dev.push(d);draw()}})}
 else if(act==='sdisc'){S.conn[v]=false;draw();toast(SRCI[v][0]+' disconnected',{undo(){S.conn[v]=true;draw()}})}
 else if(act==='sel'){S.sel=a.dataset.id||null;draw()}
 else if(act==='cday'){S.cd=+v;S.cm='day';draw()}
 else if(act==='cmode'){S.cm=v;draw()}
 else if(act==='cnav'){const x=dt(S.cd);S.cd=v==='0'?0:S.cm==='month'?off(new Date(Date.UTC(x.getUTCFullYear(),x.getUTCMonth()+ +v,1))):S.cd+ +v*(S.cm==='week'?7:1);draw()}
 else if(act==='tundo'){tu&&tu();$('#toast').classList.remove('show')}
 else if(act==='calib'){toast('Thanks. Future estimates will adjust.')}
 else if(act==='tab'){S.tab=v;S.view='dash';draw()}
 else if(act==='view'){S.view=v;draw();main.scrollTop=0}
 else if(act==='edit'){S.view='dash';tog('edit');S.gal=false;draw()}
 else if(act==='gal'){S.gal=!S.gal;draw()}
 else if(act==='setup')obOpen(1,0,S.conn[v]===false?v:null);
 else if(act==='obtpl'){O.tpl=v;drawOb()}
 else if(act==='obstep'){O.step=+v;O.open=null;O.err='';drawOb()}
 else if(act==='obopen'){O.open=O.open===v?null:v;O.err='';drawOb()}
 else if(act==='obdisc'){O.conn[v]=false;drawOb()}
 else if(act==='obconn'){const need={canvas:['curl','ctok'],ls:['ical'],wx:['city']}[v]||[];O.err=need.some(k=>!(O.f[k]||'').trim())?'Fill in the field'+(need.length>1?'s':'')+' above to continue.':v==='ls'&&!/^(https?|webcal):\/\//i.test(O.f.ical.trim())?'That doesn’t look like a link. It should start with https://':'';
  if(O.err)return drawOb();O.busy=v;drawOb();setTimeout(()=>{O.conn[v]=true;O.busy=null;O.open=null;if(!$('#ob').hidden)drawOb()},RM?0:700)}
 else if(act==='obskip'){obClose();toast('Exploring with sample data. Setup is in the sidebar.')}
 else if(act==='obfin'&&O.set){S.conn={...O.conn};obClose();draw();toast('Sources updated')}
 else if(act==='obfin'){const b=JSON.stringify(S.layouts);S.conn={...O.conn};S.layouts.main=clone(TPL[O.tpl]);O.owed?S.tsrc.add('gmail'):S.tsrc.delete('gmail');S.tab='main';S.view='dash';obClose();commit(b,'Dashboard ready. ⌘K adds a task.')}
 else if(act==='add'){const b=JSON.stringify(S.layouts);S.layouts[S.tab].push([v,...W[v].def]);commit(b,W[v].title+' added')}
 else if(act==='rm'){const id=a.closest('.wd').dataset.id,b=JSON.stringify(S.layouts);S.layouts[S.tab]=S.layouts[S.tab].filter(x=>x[0]!==id);commit(b,W[id].title+' removed')}
 else if(act==='tsrc'){S.tsrc.has(v)?S.tsrc.delete(v):S.tsrc.add(v);draw()}
 else if(act==='col'){const[s,c]=v.split(':');S.col[s]=c;applyCols();draw()}
 else if(act==='lapply'){const b=JSON.stringify(S.layouts);S.layouts[S.tab]=clone(S.saved[v]).filter(x=>W[x[0]]);commit(b,`Layout "${v}" applied`)}
 else if(act==='ldel'){delete S.saved[v];persist();draw()}
 else if(act==='lexport'){navigator.clipboard.writeText(JSON.stringify({dashboard:TABS[S.tab],columns:12,widgets:S.layouts[S.tab].map(([id,w,h])=>({id,w,h}))},null,1)).then(()=>toast('Layout copied as JSON'),()=>toast('Copy was blocked by the browser.'))}
 else if(act==='newtab'){let k='d'+Date.now(),n=v,i=2;while(Object.values(TABS).includes(n))n=v+' '+i++;TABS[k]=n;S.layouts[k]=clone(TPL[v]);DEFAULTS[k]=clone(TPL[v]);S.tab=k;S.view='dash';$('#newp').classList.remove('show');draw();toast(`Dashboard "${n}" created`)}
 else if(act==='focus'){S.view='dash';tog('focus');draw()}
 else if(act==='priv'){tog('priv');draw()}
 else if(act==='rail'){tog('norail');drawIf()}
 else if(act==='sum'){S.sum=!S.sum;drawSum()}
 else if(act==='pop'){const p=$('#'+v),on=p.classList.contains('show');$$('.pop.show').forEach(x=>x.classList.remove('show'));p.classList.toggle('show',!on)}
 else if(act==='theme'){root.dataset.theme=v;draw()}
 else if(act==='undo')step(S.hist,S.fut);else if(act==='redo')step(S.fut,S.hist);
 else if(act==='reset'){const b=JSON.stringify(S.layouts);S.layouts[S.tab]=JSON.parse(JSON.stringify(DEFAULTS[S.tab]));commit(b,'Layout reset')}
 else if(act==='preset'){const id=a.closest('.wd').dataset.id,it=S.layouts[S.tab].find(x=>x[0]===id),d=W[id],b=JSON.stringify(S.layouts),[w,h]={s:[3,5],m:[4,8],l:[7,10]}[v];
  it[1]=clamp(w,d.min[0],d.max[0]);it[2]=clamp(h,d.min[1],d.max[1]);commit(b,`${d.title} resized to ${it[1]}×${it[2]}`)}
 else if(act==='copytok'){navigator.clipboard.writeText($('#cc-tokens').textContent).then(()=>toast('Tokens copied'),()=>toast('Copy was blocked. The JSON is in the page source under cc-tokens.'))}
});
const drawIf=()=>{if(S.view==='dash')drawGrid()};
document.addEventListener('change',e=>{const el=e.target;
 if(el.matches('[data-est]')){const t=T.find(x=>x.id===el.closest('.row').dataset.id);t.est=+el.value>0?Math.round(+el.value):null;draw()}
 if(el.matches('[data-prov]')){S.ai.prov=el.dataset.prov;draw()}
 if(el.matches('[data-ai]')){S.ai[el.dataset.ai]=el.checked;draw()}
 if(el.matches('[data-owed]')){el.checked?S.tsrc.add('gmail'):S.tsrc.delete('gmail');draw()}
 if(el.matches('[data-ob]'))O[el.dataset.ob]=el.checked;
 if(el.matches('[data-tog]')){tog(el.dataset.tog,el.checked);draw()}});
document.addEventListener('input',e=>{const el=e.target;
 if(el.matches('[data-note]')){const id=el.closest('.row').dataset.id;(T.find(x=>x.id===id)||EVI[id]).note=el.value}
 if(el.matches('[data-of]'))O.f[el.dataset.of]=el.value;
 if(el.matches('[data-draft]'))T.find(x=>x.id===el.closest('.row').dataset.id).draft=el.value;
 if(el.matches('[data-hq]')){S.hq=el.value;$('#hl').innerHTML=histList()}
 if(el.matches('[data-set]')){const k=el.dataset.set,n=el.value/100;S.disp[k]=el.value;$$(`[data-set=${k}]`).forEach(x=>x.value=el.value);if(k==='zoom'){S.zoom=n;drawIf()}else root.style.setProperty('--'+k,n)}});
document.addEventListener('submit',e=>{if(e.target.id==='chf'){e.preventDefault();const v=$('#chi').value.trim();if(v)say(v);return}
 if(e.target.id!=='lsf')return;e.preventDefault();const n=$('#lsn').value.trim();if(!n)return $('#lsn').focus();S.saved[n]=clone(S.layouts[S.tab]);persist();draw();toast(`Layout "${n}" saved`)});
$('#capf').addEventListener('submit',e=>{e.preventDefault();const c=$('#cap');let s=c.value.trim();if(!s){c.focus();return}
 const tm=s.match(/\b(\d{1,2})(:\d{2})?\s*(am|pm)\b/i),rel=s.match(/\b(today|tomorrow)\b/i),wk=s.match(/\b(sun|mon|tue|wed|thu|fri|sat)(s|nes|rs|ur)?(day)?\b/i);
 let day=off(new Date($('#capd').value+'T00:00Z'));if(isNaN(day))day=0;
 if(rel)day=/tom/i.test(rel[0])?1:0;else if(wk)day=(WD.findIndex(w=>w.toLowerCase()===wk[1].toLowerCase())-4+7)%7||7;
 let due;if(tm)due=fmt(+tm[1]%12+(/pm/i.test(tm[3])?12:0)+(tm[2]?+tm[2].slice(1)/60:0));else{const[hh,mm]=($('#capt').value||'17:00').split(':');due=fmt(+hh+mm/60)}
 for(const x of[tm,rel,wk])if(x)s=s.replace(x[0],'');s=(s+' ').replace(/\s+(at|by|on)\s+(?=(at|by|on)\s|$)/ig,' ').replace(/\s+(at|by|on)\s*$/i,'').replace(/\s+/g,' ').trim()||c.value.trim();
 const t={id:'n'+Date.now(),t:s,src:'manual',day,due,est:null,p:5};
 T.push(t);c.value='';$('#capd').value='2026-11-12';$('#capt').value='17:00';document.activeElement.blur();draw();toast(`Added to My tasks: ${dayShort(day)}, ${due}`,{undo(){T.splice(T.indexOf(t),1);draw()}})});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#cap').focus()}
 if(e.key==="Escape"){$$('.pop.show').forEach(p=>p.classList.remove('show'));document.activeElement.blur()}});

/* ---------- live drag-resize (edit mode) ---------- */
let rz=null;
grid.addEventListener('pointerdown',e=>{const hd=e.target.closest('.wh');if(!hd||!('edit' in root.dataset)||e.target.closest('button,a'))return;mv={id:hd.closest('.wd').dataset.id,before:JSON.stringify(S.layouts),last:null};hd.closest('.wd').classList.add('mvg');e.preventDefault()});
addEventListener('pointermove',e=>{if(!mv)return;const el=document.elementFromPoint(e.clientX,e.clientY),w=el&&el.closest('#grid .wd'),tid=w&&w.dataset.id;if(!tid)return;if(tid===mv.id){mv.last=null;return}if(tid===mv.last)return;
 const L=S.layouts[S.tab],a=L.findIndex(x=>x[0]===mv.id),b=L.findIndex(x=>x[0]===tid);L.splice(b,0,L.splice(a,1)[0]);mv.last=tid;drawGrid()});
addEventListener('pointerup',()=>{if(!mv)return;const m=mv;mv=null;if(JSON.stringify(S.layouts)!==m.before)commit(m.before,W[m.id].title+' moved');else drawGrid()});
